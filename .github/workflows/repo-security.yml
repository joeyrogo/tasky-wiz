name: Repository Security Scan

# Repository-level control that works on a free private repo:
# scans every push and pull request, regardless of path, for committed
# secrets (keys, tokens, passwords) using Trivy, the same scanner used
# for the container image and the Terraform.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Scan repository for secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          # Unlike the IaC scan, nothing here is an intentional weakness:
          # a committed secret is always a real finding, so fail the run.
          exit-code: "1"
